<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 关键视口适配 -->
    <title>员工登录</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
    <div class="login-container" id="app">
        <h2>员工登录</h2>
        <form @submit.prevent="handleLogin">
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" v-model="formData.name" maxlength="30" required>
            </div>
            <div class="form-group">
                <label for="idcard">身份证号：</label>
                <input type="text" id="idcard" v-model="formData.idcard" maxlength="18" 
                       pattern="^[0-9Xx]{1,18}$" title="只能输入数字或X/x" required>
            </div>
            <div class="form-group">
                <label for="password">登录密码：</label>
                <input type="password" id="password" v-model="formData.password" maxlength="12" required>
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
